<!doctype html>
<meta charset="utf-8">
<title>TikTok callback</title>
<style>
  body{font:15px/1.6 system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 20px}
  code{background:#f4f4f5;padding:2px 6px;border-radius:4px;word-break:break-all}
  .box{background:#f4f4f5;padding:16px;border-radius:8px;margin-top:16px}
</style>
<h1>Autorisation TikTok</h1>
<p id="status">Redirection vers l'application locale…</p>
<div class="box" id="fallback" style="display:none">
  <p>La redirection n'a pas fonctionné. Copie ce code dans ton script :</p>
  <p><code id="code"></code></p>
</div>

<script>
  var LOCAL = "http://127.0.0.1:8080/tiktok/callback";
  var qs = window.location.search;
  var params = new URLSearchParams(qs);

  if (params.get("error")) {
    document.getElementById("status").textContent =
      "Erreur TikTok : " + params.get("error") + " — " + (params.get("error_description") || "");
  } else if (params.get("code")) {
    document.getElementById("code").textContent = params.get("code");
    // Laisse 3 s au serveur local, puis affiche le code en secours
    setTimeout(function () {
      document.getElementById("status").textContent = "";
      document.getElementById("fallback").style.display = "block";
    }, 3000);
    window.location.replace(LOCAL + qs);
  } else {
    document.getElementById("status").textContent = "Aucun code reçu.";
  }
</script>
